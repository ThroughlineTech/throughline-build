name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            rid: osx-arm64
            artifact: build
          - os: windows-latest
            rid: win-x64
            artifact: build.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact: build
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore --locked-mode --nologo -v q
      - run: dotnet test --no-restore --nologo -v q --logger "console;verbosity=minimal"
      - run: dotnet format --no-restore --verify-no-changes -v q
      - run: dotnet publish src/ThroughlineBuild.Cli -r ${{ matrix.rid }} -c Release --no-restore --nologo -v q
      - run: python tools/publication_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.rid }}
          path: src/ThroughlineBuild.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.artifact }}
          retention-days: 7
