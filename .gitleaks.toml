title = "Throughline Build secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic credential used to test transcript redaction"
regexTarget = "match"
regexes = [
  '''sk-ant-LEAKEDvalue1234567''',
]

[[allowlists]]
description = "Historical code assigns a secret value to a client option without embedding it"
regexTarget = "match"
regexes = [
  '''ApiKey\s*=\s*secrets2\.AnthropicApiKey''',
]
